<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MIRAMARADONA</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">

    <!-- EXIF.js -->
    <script src="https://cdn.jsdelivr.net/npm/exif-js"></script>

    <!-- IDB -->
    <script src="https://cdn.jsdelivr.net/npm/idb@8/build/umd.js"></script>

    <!-- Turnstile -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <div id="map"></div>
    <div class="map-watermark"></div>

    <!-- Logo Container -->
    <div class="logo-container glass-panel">
        <img src="assets/logo_azzurro_01.svg" alt="MIRAMARADONA Logo" class="main-logo">
    </div>

    <!-- Floating Action Button for Location -->
    <button id="btn-location" class="fab fab-location" title="Vai alla Posizione Attuale">
        <i data-lucide="crosshair"></i>
    </button>

    <!-- Floating Action Button for Upload Panel -->
    <button id="btn-toggle-panel" class="fab fab-upload" title="Carica una foto" aria-label="Apri pannello upload">
        <i data-lucide="camera"></i>
    </button>

    <!-- Sidebar Overlay -->
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <!-- Hidden File Input -->
    <input type="file" id="photo-upload" accept="image/jpeg, image/png, image/webp" class="file-input" multiple hidden>

    <!-- Right Sidebar Panel -->
    <div id="upload-sidebar" class="upload-sidebar glass-panel">

        <!-- Sidebar Message Section (Ex Modal) -->
        <div id="sidebar-message-area" class="sidebar-message-area" style="display: none;">
            <div class="message-content">
                <h3 id="modal-title">Titolo</h3>
                <p id="modal-message">Messaggio del modal.</p>
                <div class="modal-actions">
                    <button id="modal-primary-btn" class="btn btn-primary">Ok</button>
                    <button id="modal-secondary-btn" class="btn btn-secondary">Annulla</button>
                </div>
            </div>
        </div>

        <!-- Preview & Categorization Section (Initially Hidden) -->
        <div id="preview-section" class="preview-section" style="display: none;">
            <p class="section-title">Foto da inviare (<span id="pending-count-ui">0</span>)</p>
            <div id="preview-list" class="preview-list">
                <!-- Items will be injected here -->
            </div>

            <div class="preview-actions">
                <button id="btn-confirm-upload" class="btn btn-success">
                    <i data-lucide="send"></i> Invia Tutte
                </button>
                <button id="btn-cancel-preview" class="btn btn-secondary">
                    Annulla tutto
                </button>
            </div>
        </div>

        <div class="verification-section" style="display: none;">
            <div class="cf-turnstile" data-sitekey="1x00000000000000000000AA" data-size="invisible"
                data-callback="onTurnstileSuccess" data-expired-callback="onTurnstileExpired"
                data-error-callback="onTurnstileError"></div>
        </div>

        <!-- Status Indicator -->
        <div id="upload-status" class="upload-status" style="display: none;">
            <div class="spinner"></div>
            <span id="status-text">Caricamento in corso...</span>
        </div>
    </div>

    <!-- Global Modal removed as it's now in the sidebar -->

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>

    <!-- Custom JS -->
    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
